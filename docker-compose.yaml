services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudproject-backend-container
    command: sh -c "npm install && npm run dev:docker"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    ports:
     - "3000:3000"
    env_file:
     - .env 
    volumes:
      - .:/app                    
      - /app/node_modules 
    depends_on:
      redis : 
        condition : service_healthy
      localstack:
        condition: service_healthy
      dynamo-init:
        condition: service_completed_successfully
    networks:
      - project-network
    restart : unless-stopped  

  redis:
      image: redis:7-alpine
      container_name : redis-container
      ports : 
        - "6379:6379"
      command : >
        redis-server
        --requirepass redisCache_Password
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
      volumes:
        - redis_data:/data            
      networks:
        - project-network
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "redisCache_Password", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  # ─── LocalStack ────────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack-container
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3
      - DEFAULT_REGION=${AWS_REGION:-ap-south-1}
      - DEBUG=0
      - PERSISTENCE=1
      - LOCALSTACK_HOST=localhost:4566
      - S3_HOSTNAME_EXTERNAL=localhost
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dynamo-init:
    image: amazon/aws-cli:latest
    container_name: dynamo-init-container
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - BUCKET_NAME=${BUCKET_NAME:-rohith04-bucket}
    networks:
      - project-network
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        ENDPOINT="http://localstack:4566"
        REGION="ap-south-1"

        table_exists() {
          aws dynamodb describe-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name "$$1" >/dev/null 2>&1
        }

        wait_for_table() {
          aws dynamodb wait table-exists \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name "$$1"
        }

        get_index_status() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"

          aws dynamodb describe-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name "$$TABLE_NAME" \
            --query "Table.GlobalSecondaryIndexes[?IndexName=='$$INDEX_NAME'].IndexStatus | [0]" \
            --output text
        }

        get_index_keys() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"

          aws dynamodb describe-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name "$$TABLE_NAME" \
            --query "Table.GlobalSecondaryIndexes[?IndexName=='$$INDEX_NAME'].KeySchema[].AttributeName" \
            --output text
        }

        wait_for_index_active() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"

          while true; do
            INDEX_STATUS=$$(get_index_status "$$TABLE_NAME" "$$INDEX_NAME")

            if [ "$$INDEX_STATUS" = "ACTIVE" ]; then
              return 0
            fi

            if [ "$$INDEX_STATUS" = "None" ]; then
              echo "Expected $$TABLE_NAME.$$INDEX_NAME to exist, got: $$INDEX_STATUS" >&2
              exit 1
            fi

            echo ">>> Waiting for $$TABLE_NAME.$$INDEX_NAME to become ACTIVE (current: $$INDEX_STATUS)"
            sleep 2
          done
        }

        wait_for_index_deleted() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"

          while true; do
            INDEX_STATUS=$$(get_index_status "$$TABLE_NAME" "$$INDEX_NAME")

            if [ "$$INDEX_STATUS" = "None" ]; then
              return 0
            fi

            echo ">>> Waiting for stale $$TABLE_NAME.$$INDEX_NAME to be deleted (current: $$INDEX_STATUS)"
            sleep 2
          done
        }

        index_has_expected_keys() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"
          FIRST_KEY="$$3"
          SECOND_KEY="$${4:-}"

          INDEX_KEYS=$$(get_index_keys "$$TABLE_NAME" "$$INDEX_NAME")

          case "$$INDEX_KEYS" in
            *"$$FIRST_KEY"*) ;;
            *) return 1 ;;
          esac

          if [ -n "$$SECOND_KEY" ]; then
            case "$$INDEX_KEYS" in
              *"$$SECOND_KEY"*) ;;
              *) return 1 ;;
            esac
          fi

          return 0
        }

        create_gsi() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"
          ATTRIBUTE_DEFINITIONS="$$3"
          KEY_SCHEMA="$$4"

          aws dynamodb update-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name "$$TABLE_NAME" \
            --attribute-definitions $$ATTRIBUTE_DEFINITIONS \
            --global-secondary-index-updates "[{\"Create\":{\"IndexName\":\"$$INDEX_NAME\",\"KeySchema\":$$KEY_SCHEMA,\"Projection\":{\"ProjectionType\":\"ALL\"}}}]"
        }

        delete_gsi() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"

          aws dynamodb update-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name "$$TABLE_NAME" \
            --global-secondary-index-updates "[{\"Delete\":{\"IndexName\":\"$$INDEX_NAME\"}}]"
        }

        ensure_index() {
          TABLE_NAME="$$1"
          INDEX_NAME="$$2"
          ATTRIBUTE_DEFINITIONS="$$3"
          KEY_SCHEMA="$$4"
          FIRST_KEY="$$5"
          SECOND_KEY="$${6:-}"

          INDEX_STATUS=$$(get_index_status "$$TABLE_NAME" "$$INDEX_NAME")

          if [ "$$INDEX_STATUS" = "None" ]; then
            echo ">>> Adding missing GSI: $$TABLE_NAME.$$INDEX_NAME"
            create_gsi "$$TABLE_NAME" "$$INDEX_NAME" "$$ATTRIBUTE_DEFINITIONS" "$$KEY_SCHEMA"
            wait_for_index_active "$$TABLE_NAME" "$$INDEX_NAME"
            return 0
          fi

          wait_for_index_active "$$TABLE_NAME" "$$INDEX_NAME"

          if index_has_expected_keys "$$TABLE_NAME" "$$INDEX_NAME" "$$FIRST_KEY" "$$SECOND_KEY"; then
            return 0
          fi

          INDEX_KEYS=$$(get_index_keys "$$TABLE_NAME" "$$INDEX_NAME")
          echo ">>> Recreating stale GSI: $$TABLE_NAME.$$INDEX_NAME. Current keys: $$INDEX_KEYS"
          delete_gsi "$$TABLE_NAME" "$$INDEX_NAME"
          wait_for_index_deleted "$$TABLE_NAME" "$$INDEX_NAME"
          create_gsi "$$TABLE_NAME" "$$INDEX_NAME" "$$ATTRIBUTE_DEFINITIONS" "$$KEY_SCHEMA"
          wait_for_index_active "$$TABLE_NAME" "$$INDEX_NAME"
        }

        echo ">>> Creating table: users  |  GSI: UsernameIndex on name"
        if table_exists users; then
          echo ">>> Table already exists: users"
        else
          aws dynamodb create-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name users \
            --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=name,AttributeType=S \
            --key-schema \
              AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --global-secondary-indexes \
              '[{"IndexName":"UsernameIndex","KeySchema":[{"AttributeName":"name","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]'
        fi
        wait_for_table users
        ensure_index users UsernameIndex "AttributeName=name,AttributeType=S" '[{"AttributeName":"name","KeyType":"HASH"}]' name

        echo ">>> Creating table: folders  |  GSI: ParentIdIndex on parentId"
        if table_exists folders; then
          echo ">>> Table already exists: folders"
        else
          aws dynamodb create-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name folders \
            --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=parentId,AttributeType=S \
            --key-schema \
              AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --global-secondary-indexes \
              '[{"IndexName":"ParentIdIndex","KeySchema":[{"AttributeName":"parentId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]'
        fi
        wait_for_table folders
        ensure_index folders ParentIdIndex "AttributeName=parentId,AttributeType=S" '[{"AttributeName":"parentId","KeyType":"HASH"}]' parentId

        echo ">>> Creating table: objects  |  GSI: FolderIdIndex on folderId + status, FolderNameIndex on folderId + name"
        if table_exists objects; then
          echo ">>> Table already exists: objects"
        else
          aws dynamodb create-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name objects \
            --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=folderId,AttributeType=S \
              AttributeName=status,AttributeType=S \
              AttributeName=name,AttributeType=S \
            --key-schema \
              AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --global-secondary-indexes \
              '[{"IndexName":"FolderIdIndex","KeySchema":[{"AttributeName":"folderId","KeyType":"HASH"},{"AttributeName":"status","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}},{"IndexName":"FolderNameIndex","KeySchema":[{"AttributeName":"folderId","KeyType":"HASH"},{"AttributeName":"name","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]'
        fi
        wait_for_table objects
        ensure_index objects FolderIdIndex "AttributeName=folderId,AttributeType=S AttributeName=status,AttributeType=S" '[{"AttributeName":"folderId","KeyType":"HASH"},{"AttributeName":"status","KeyType":"RANGE"}]' folderId status
        ensure_index objects FolderNameIndex "AttributeName=folderId,AttributeType=S AttributeName=name,AttributeType=S" '[{"AttributeName":"folderId","KeyType":"HASH"},{"AttributeName":"name","KeyType":"RANGE"}]' folderId name

        echo ">>> Creating table: RefreshTokens  |  GSIs: RefreshTokenIndex, RefreshTokenUserIdIndex"
        if table_exists RefreshTokens; then
          echo ">>> Table already exists: RefreshTokens"
        else
          aws dynamodb create-table \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --table-name RefreshTokens \
            --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=refreshToken,AttributeType=S \
              AttributeName=userId,AttributeType=S \
            --key-schema \
              AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --global-secondary-indexes \
              '[{"IndexName":"RefreshTokenIndex","KeySchema":[{"AttributeName":"refreshToken","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}},{"IndexName":"RefreshTokenUserIdIndex","KeySchema":[{"AttributeName":"userId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]'
        fi
        wait_for_table RefreshTokens
        ensure_index RefreshTokens RefreshTokenIndex "AttributeName=refreshToken,AttributeType=S" '[{"AttributeName":"refreshToken","KeyType":"HASH"}]' refreshToken
        ensure_index RefreshTokens RefreshTokenUserIdIndex "AttributeName=userId,AttributeType=S" '[{"AttributeName":"userId","KeyType":"HASH"}]' userId

        echo ">>> Creating S3 bucket: $$BUCKET_NAME"
        if aws s3api head-bucket \
          --endpoint-url "$$ENDPOINT" \
          --region "$$REGION" \
          --bucket "$$BUCKET_NAME" >/dev/null 2>&1; then
          echo ">>> Bucket already exists: $$BUCKET_NAME"
        else
          aws s3api create-bucket \
            --endpoint-url "$$ENDPOINT" \
            --region "$$REGION" \
            --bucket "$$BUCKET_NAME" \
            --create-bucket-configuration LocationConstraint="$$REGION"
        fi

        echo ">>> Blocking public access for bucket: $$BUCKET_NAME"
        aws s3api put-public-access-block \
          --endpoint-url "$$ENDPOINT" \
          --region "$$REGION" \
          --bucket "$$BUCKET_NAME" \
          --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

        echo ">>> Enabling versioning for bucket: $$BUCKET_NAME"
        aws s3api put-bucket-versioning \
          --endpoint-url "$$ENDPOINT" \
          --region "$$REGION" \
          --bucket "$$BUCKET_NAME" \
          --versioning-configuration Status=Enabled

        echo ">>> Done: users (UsernameIndex) | folders (ParentIdIndex) | objects (FolderIdIndex) | RefreshTokens (RefreshTokenIndex, RefreshTokenUserIdIndex) | S3 bucket $$BUCKET_NAME"

volumes:
  redis_data:
  localstack_data:

networks:
  project-network :
    driver : bridge