services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudproject-backend-container
    command: sh -c "npm install && npm run dev"
    ports:
     - "3000:3000"
    env_file:
     - .env 
    volumes:
      - .:/app                    
      - /app/node_modules 
    depends_on:
      redis : 
        condition : service_healthy
      localstack:
        condition: service_healthy
    networks:
      - project-network
    restart : unless-stopped  

  redis:
      image: redis:7-alpine
      container_name : redis-container
      ports : 
        - "6379:6379"
      command : >
        redis-server
        --requirepass redisCache_Password
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
      volumes:
        - redis_data:/data            
      networks:
        - project-network
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "localpassword", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  # ─── LocalStack ────────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack-container
    ports:
      - "4566:4566"         # LocalStack gateway — all AWS service calls go here
    environment:
      - SERVICES=dynamodb   # Boot only DynamoDB; add more later (e.g. s3,sqs)
      - DEFAULT_REGION=${AWS_REGION:-ap-south-1}
      - DEBUG=0             # Flip to 1 if you need verbose LocalStack logs
      - PERSISTENCE=1       # Persist DynamoDB state across container restarts
    volumes:
      - localstack_data:/var/lib/localstack   # Persistent state volume
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s     # Give LocalStack time to boot before health checks start

  # ─── DynamoDB Table Bootstrap ───────────────────────────────────────────────
  # Runs once after LocalStack is healthy, creates all your tables, then exits.
  dynamo-init:
    image: amazon/aws-cli:latest
    container_name: dynamo-init-container
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
    networks:
      - project-network
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo ">>> Waiting for DynamoDB to be ready..." &&
        sleep 5 &&
        echo ">>> Creating table: Users" &&
        aws dynamodb create-table --endpoint-url http://localstack:4566 --table-name users --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ap-south-1 || true &&
        echo ">>> Creating table: Folders" &&
        aws dynamodb create-table --endpoint-url http://localstack:4566 --table-name folders --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ap-south-1 || true &&
        echo ">>> Creating table: Objects" &&
        aws dynamodb create-table --endpoint-url http://localstack:4566 --table-name objects --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ap-south-1 || true &&
        echo ">>> All tables created: users, folders, objects."

volumes:
  redis_data:
  localstack_data:    # Named volume so DynamoDB state survives docker compose restarts

networks:
  project-network :
    driver : bridge